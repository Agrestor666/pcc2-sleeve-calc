<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" width="32" height="32">
  <!-- Background -->
  <rect width="32" height="32" rx="6" fill="#1a1e24"/>

  <!-- Left pipe segment -->
  <rect x="2" y="13.5" width="9" height="5" rx="2.5" fill="#58a6ff"/>

  <!-- Right pipe segment -->
  <rect x="21" y="13.5" width="9" height="5" rx="2.5" fill="#58a6ff"/>

  <!-- Center sleeve (Type B wrap)  taller than the pipe -->
